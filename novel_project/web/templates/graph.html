<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱 - 网文图谱分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/vis-network.min.js"></script>
    <link rel="stylesheet" href="/static/css/vis-network.min.css">
    <style>
        #graphContainer { background: #111827 !important; }
        .vis-network:focus { outline: none; }
        .vis-tooltip { background: #1f2937 !important; color: #e5e7eb !important; border: 1px solid #4b5563 !important; border-radius: 6px !important; padding: 6px 10px !important; font-size: 13px !important; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center">
        <div class="flex items-center space-x-6">
            <h1 class="text-xl font-bold">📖 网文图谱</h1>
            <a href="/" class="text-gray-400 hover:text-white">首页</a>
            <a href="/upload" class="text-gray-400 hover:text-white">上传</a>
            <a href="/graph" class="text-blue-400">图谱</a>
            <a href="/chat" class="text-gray-400 hover:text-white">问答</a>
        </div>
    </nav>
    <main class="p-6">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 class="text-2xl font-bold">人物关系图谱</h2>
            <div class="flex items-center space-x-3 flex-wrap gap-2">
                <label class="text-gray-400 text-sm">书籍：</label>
                <select id="novelSelector" onchange="switchNovel()" class="px-3 py-1 bg-gray-700 text-white rounded border border-gray-600 text-sm">
                    <option value="">-- 选择 --</option>
                </select>
                <input type="text" id="searchNode" placeholder="搜索人物..." class="px-3 py-1 bg-gray-700 text-white rounded border border-gray-600 text-sm w-32">
                <button onclick="filterNode()" class="px-3 py-1 bg-blue-600 rounded hover:bg-blue-700 text-sm">聚焦</button>
                <button onclick="resetView()" class="px-3 py-1 bg-gray-600 rounded hover:bg-gray-500 text-sm">全图</button>
                <select id="roleFilter" onchange="filterByRole()" class="px-3 py-1 bg-gray-700 text-white rounded border border-gray-600 text-sm">
                    <option value="all">全部</option>
                    <option value="主角">主角</option>
                    <option value="配角">配角</option>
                </select>
            </div>
        </div>
        <div class="flex gap-4">
            <div id="graphContainer" class="bg-gray-900 rounded-lg flex-1 border border-gray-700" style="height: 620px;"></div>
            <div id="nodeDetail" class="bg-gray-800 rounded-lg w-72 p-4 hidden border border-gray-700">
                <h3 id="detailName" class="text-lg font-bold mb-1"></h3>
                <p id="detailRole" class="text-gray-400 text-xs mb-1"></p>
                <p id="detailCount" class="text-gray-400 text-xs mb-3"></p>
                <h4 class="text-sm text-gray-500 mb-1">关联关系</h4>
                <div id="detailRelations" class="text-xs space-y-1 max-h-64 overflow-y-auto"></div>
            </div>
        </div>
        <div class="flex justify-between items-center mt-2">
            <p id="graphInfo" class="text-gray-500 text-sm"></p>
            <div class="flex space-x-4 text-xs text-gray-500">
                <span><span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-1"></span>敌对/冲突</span>
                <span><span class="inline-block w-3 h-3 rounded-full bg-blue-400 mr-1"></span>同盟/友好</span>
                <span><span class="inline-block w-3 h-3 rounded-full bg-gray-500 mr-1"></span>从属/上下级</span>
                <span><span class="inline-block w-3 h-3 rounded-full bg-cyan-400 mr-1"></span>其他关系</span>
            </div>
        </div>
    </main>

    <script>
        let network = null;
        let allNodes = [];
        let allEdges = [];
        let currentNovel = '';

        // 关系类型判断
        function classifyRelation(text) {
            const t = (text || '').toLowerCase();
            if (/敌|仇|杀|战|斗|打|败|害|反|叛|怒|恨|争|怨/.test(t)) return 'hostile';
            if (/友|盟|同|帮|助|救|忠|护|师|徒|爱|情|亲/.test(t)) return 'friendly';
            if (/属|下|上|级|从|臣|君|主/.test(t)) return 'subordinate';
            return 'other';
        }

        // 关系颜色映射
        const edgeColors = {
            hostile: { color: '#ef4444', highlight: '#f87171', dash: true },
            friendly: { color: '#60a5fa', highlight: '#93c5fd', dash: false },
            subordinate: { color: '#6b7280', highlight: '#9ca3af', dash: false },
            other: { color: '#22d3ee', highlight: '#67e8f9', dash: false }
        };

        // 阵营颜色（按主角/配角区分）
        function nodeColor(node) {
            if (node.role === '主角') return { background: '#f59e0b', border: '#fbbf24' };
            if (node.role === '配角') return { background: '#3b82f6', border: '#60a5fa' };
            return { background: '#6b7280', border: '#9ca3af' };
        }

        // 页面加载
        fetch('/api/novels').then(r => r.json()).then(novels => {
            const sel = document.getElementById('novelSelector');
            sel.innerHTML = '<option value="">-- 选择书籍 --</option>';
            novels.forEach(n => { sel.innerHTML += `<option value="${n.name}">${n.name}</option>`; });
            if (novels.length > 0) { sel.value = novels[0].name; switchNovel(); }
        });

        function calcDegrees(edges) {
            const deg = {};
            edges.forEach(e => { deg[e.source] = (deg[e.source] || 0) + 1; deg[e.target] = (deg[e.target] || 0) + 1; });
            return deg;
        }

        function switchNovel() {
            const novel = document.getElementById('novelSelector').value;
            if (!novel) return;
            currentNovel = novel;
            document.getElementById('nodeDetail').classList.add('hidden');
            document.getElementById('graphInfo').textContent = '加载中...';
            fetch(`/api/graph?novel=${novel}`).then(r => r.json()).then(data => {
                if (data.error) { document.getElementById('graphInfo').textContent = data.error; return; }
                allNodes = data.nodes || [];
                allEdges = data.edges || [];
                document.getElementById('graphInfo').textContent = `${allNodes.length} 角色, ${allEdges.length} 关系`;
                renderGraph(allNodes, allEdges);
            });
        }

        function renderGraph(nodes, edges) {
            const container = document.getElementById('graphContainer');
            const degrees = calcDegrees(edges);
            const maxDeg = Math.max(1, ...Object.values(degrees));

            // 找赵玖作为锚点（如果存在）
            const zhaojiu = nodes.find(n => n.name.includes('赵玖'));

            const visNodes = new vis.DataSet(nodes.map(n => {
                const deg = degrees[n.name] || 1;
                const size = Math.max(14, Math.min(50, 10 + (deg / maxDeg) * 40));
                return {
                    id: n.name, label: n.name,
                    size: size,
                    font: { size: Math.max(10, Math.min(18, size * 0.4)), color: '#f3f4f6', strokeWidth: 2, strokeColor: '#111827' },
                    color: nodeColor(n),
                    borderWidth: 2,
                    // 赵玖固定在中央
                    x: zhaojiu && n.name === zhaojiu.name ? 0 : undefined,
                    y: zhaojiu && n.name === zhaojiu.name ? 0 : undefined,
                    fixed: zhaojiu && n.name === zhaojiu.name ? true : false,
                    title: `角色: ${n.role || '未知'} | 出场: ${n.mention_count || 0}次 | 关联: ${deg}人`
                };
            }));

            const visEdges = new vis.DataSet(edges.slice(0, 800).map(e => {
                const rel = classifyRelation(e.relation || '');
                const style = edgeColors[rel];
                const width = Math.max(0.5, Math.min(4, (e.weight || 1) * 0.6));
                // 关键关系（权重高或敌对）加粗高亮
                const isKey = (e.weight || 1) >= 3 || rel === 'hostile';
                return {
                    from: e.source, to: e.target,
                    label: (e.relation || '').length > 8 ? (e.relation || '').slice(0, 8) + '…' : (e.relation || ''),
                    font: { size: isKey ? 11 : 8, color: isKey ? '#e5e7eb' : '#6b7280', strokeWidth: isKey ? 3 : 1, strokeColor: '#111827', align: 'middle' },
                    width: isKey ? width + 1 : width * 0.7,
                    color: { color: style.color, highlight: style.highlight, opacity: isKey ? 0.9 : 0.45 },
                    smooth: { type: 'continuous', roundness: 0.2 },
                    dashes: style.dash ? [6, 3] : false,
                    chosen: { edge: (values) => { values.width *= 1.5; } }
                };
            }));

            network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -40,
                        centralGravity: 0.005,
                        springLength: 180,
                        springConstant: 0.02,
                        damping: 0.4,
                        avoidOverlap: 0.5
                    },
                    stabilization: { iterations: 200, updateInterval: 25 },
                    minVelocity: 0.5,
                    maxVelocity: 50
                },
                layout: { improvedLayout: true },
                edges: {
                    smooth: { type: 'continuous', roundness: 0.2 },
                    arrowStrikethrough: false
                },
                interaction: {
                    hover: true, tooltipDelay: 150,
                    navigationButtons: true, keyboard: true
                },
                nodes: {
                    font: { color: '#f3f4f6', strokeWidth: 2, strokeColor: '#111827' },
                    borderWidth: 2,
                    shadow: { enabled: true, size: 6, color: 'rgba(0,0,0,0.4)' }
                },
                configure: { enabled: false }
            });

            // 赵玖居中高亮
            if (zhaojiu) {
                network.once('stabilized', () => {
                    network.focus(zhaojiu.name, { scale: 1.2, animation: true });
                });
            }

            network.on('click', function(params) {
                if (params.nodes.length > 0) showNodeDetail(params.nodes[0]);
                else document.getElementById('nodeDetail').classList.add('hidden');
            });
        }

        function showNodeDetail(nodeId) {
            const node = allNodes.find(n => n.name === nodeId);
            if (!node) return;
            document.getElementById('detailName').textContent = node.name;
            document.getElementById('detailRole').textContent = '角色: ' + (node.role || '未知');
            // 计算度数
            const deg = allEdges.filter(e => e.source === nodeId || e.target === nodeId).length;
            document.getElementById('detailCount').textContent = '关联: ' + deg + ' 人 | 出场: ' + (node.mention_count || 0) + ' 次';
            const relations = allEdges.filter(e => e.source === nodeId || e.target === nodeId).slice(0, 20);
            document.getElementById('detailRelations').innerHTML = relations.map(r => {
                const other = r.source === nodeId ? r.target : r.source;
                const rel = classifyRelation(r.relation || '');
                const color = edgeColors[rel].color;
                return `<div class="text-gray-300 py-0.5"><span style="color:${color}">●</span> ${other} <span class="text-gray-500">${r.relation || ''}</span></div>`;
            }).join('');
            document.getElementById('nodeDetail').classList.remove('hidden');
        }

        function filterNode() {
            const q = document.getElementById('searchNode').value.trim().toLowerCase();
            if (!q) { resetView(); return; }
            const matched = allNodes.filter(n => n.name.toLowerCase().includes(q));
            if (matched.length === 0) { alert('未找到匹配的人物'); return; }
            const center = matched[0].name;
            const neighborNames = new Set([center]);
            allEdges.forEach(e => {
                if (e.source === center) neighborNames.add(e.target);
                if (e.target === center) neighborNames.add(e.source);
            });
            const filteredNodes = allNodes.filter(n => neighborNames.has(n.name));
            const filteredEdges = allEdges.filter(e => neighborNames.has(e.source) && neighborNames.has(e.target));
            renderGraph(filteredNodes, filteredEdges);
            network.once('stabilized', () => {
                network.focus(center, { scale: 2.0, animation: true });
                network.selectNodes([center], true);
                showNodeDetail(center);
            });
            document.getElementById('graphInfo').textContent = `${filteredNodes.length} 角色（以 ${center} 为中心）, ${filteredEdges.length} 关系`;
        }

        function resetView() {
            document.getElementById('nodeDetail').classList.add('hidden');
            renderGraph(allNodes, allEdges);
            document.getElementById('graphInfo').textContent = `${allNodes.length} 角色, ${allEdges.length} 关系`;
        }

        function filterByRole() {
            const role = document.getElementById('roleFilter').value;
            document.getElementById('nodeDetail').classList.add('hidden');
            if (role === 'all') { renderGraph(allNodes, allEdges); return; }
            const filtered = allNodes.filter(n => n.role === role);
            const names = new Set(filtered.map(n => n.name));
            const edges = allEdges.filter(e => names.has(e.source) && names.has(e.target));
            renderGraph(filtered, edges);
            document.getElementById('graphInfo').textContent = `${filtered.length} 个${role}, ${edges.length} 条关系`;
        }
    </script>
</body>
</html>
