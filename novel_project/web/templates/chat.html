<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI问答 - NovelGraph</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="/static/js/auth.js?v=2"></script>
<script>
tailwind.config={theme:{extend:{colors:{tech:{main:'#22d3ee',dark:'#0891b2',bg:'#0c1222',card:'rgba(255,255,255,0.05)',border:'rgba(34,211,238,0.2)',text:'#e2e8f0'}},boxShadow:{glow:'0 0 18px rgba(34,211,238,0.15)'}}}}
</script>
<style>
.glass{backdrop-filter:blur(12px);background:rgba(255,255,255,0.05);border:1px solid rgba(34,211,238,0.2);border-radius:12px}
.btn-tech{background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.4);color:#22d3ee;padding:8px 20px;border-radius:8px;transition:all 0.3s;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-tech:hover{background:rgba(34,211,238,0.2)}
.btn-solid{background:#22d3ee;color:#0c1222;padding:8px 20px;border-radius:8px;transition:all 0.3s;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-solid:hover{background:#0891b2}
.btn-solid:disabled{opacity:0.5;cursor:not-allowed}
.nav-link{padding:8px 16px;border-radius:8px;color:rgba(226,232,240,0.7);transition:all 0.3s}
.nav-link:hover{color:#22d3ee;background:rgba(34,211,238,0.05)}
.nav-active{color:#22d3ee;background:rgba(34,211,238,0.1)}
.scroll-hide::-webkit-scrollbar{display:none}
.scroll-hide{-ms-overflow-style:none;scrollbar-width:none}
body{background:#0c1222;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.message-text h3{font-size:14px;font-weight:bold;margin:12px 0 4px;color:#22d3ee}
.message-text h4{font-size:13px;font-weight:bold;margin:8px 0 3px;color:#e2e8f0}
.message-text ul{padding-left:16px;margin:4px 0}
.message-text li{list-style:disc;margin:2px 0}
.message-text b{color:#fbbf24}
.message-text .citation{color:#22d3ee;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.message-text .citation:hover{color:#67e8f9}
.message-text code{background:rgba(34,211,238,0.1);padding:1px 5px;border-radius:4px;font-size:12px}
</style>

<body class="flex flex-col h-screen">
<nav class="glass mx-6 mt-6 px-6 py-3 z-50">
<div class="flex items-center justify-between">
<a href="/" class="flex items-center gap-3"><i class="fa fa-sitemap text-[#22d3ee] text-2xl"></i><span class="text-xl font-bold tracking-wide">NovelGraph</span></a>
<div class="flex gap-2">
<a href="/" class="nav-link" data-perm="page:dashboard"><i class="fa fa-home mr-1.5"></i>首页</a>
<a href="/upload" class="nav-link" data-perm="page:upload"><i class="fa fa-upload mr-1.5"></i>上传解析</a>
<a href="/graph" class="nav-link" data-perm="page:graph"><i class="fa fa-share-alt mr-1.5"></i>关系图谱</a>
<a href="/chat" class="nav-link nav-active" data-perm="page:chat"><i class="fa fa-commenting mr-1.5"></i>AI问答</a>
</div>
<div class="flex items-center gap-3">
<span id="userInfo" class="text-sm text-tech-text/60"></span>
<a href="/login" id="loginBtn" class="btn-tech text-sm">登录</a>
<button id="logoutBtn" onclick="AUTH.logout()" class="btn-tech text-sm hidden">登出</button>
</div>
</div>
</nav>

<main class="flex-1 flex mx-6 my-4 gap-4" style="height:calc(100vh - 100px);">
<!-- 左侧：会话列表 -->
<div class="glass flex flex-col" style="width:220px;flex-shrink:0;">
<div class="p-3 border-b border-tech-border flex items-center justify-between">
<span class="font-bold text-sm"><i class="fa fa-comments text-[#22d3ee] mr-1.5"></i>会话</span>
<button onclick="newSession()" class="btn-tech p-1.5 text-xs" title="新建会话"><i class="fa fa-plus"></i></button>
</div>
<div id="sessionList" class="flex-1 overflow-y-auto p-2 space-y-1 scroll-hide"></div>
<div class="p-2 border-t border-tech-border">
<button onclick="clearAllSessions()" class="btn-tech w-full text-xs justify-center"><i class="fa fa-trash-o"></i>清空全部</button>
</div>
</div>

<!-- 中间：聊天区域 -->
<div class="glass flex-1 flex flex-col">
<div id="chatHeader" class="px-5 py-3 border-b border-tech-border flex items-center justify-between">
<span id="sessionTitle" class="text-sm font-bold">新对话</span>
<span id="msgCount" class="text-xs text-tech-text/50"></span>
</div>
<div id="chatMessages" class="flex-1 overflow-y-auto p-5 space-y-4 scroll-hide"></div>
<div class="p-4 border-t border-tech-border">
<div class="flex gap-2">
<input type="text" id="chatInput" placeholder="输入你的问题..." class="flex-1 px-4 py-3 rounded-lg bg-tech-card border border-tech-border text-white outline-none focus:border-[#22d3ee]" onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="sendMessage()" class="btn-solid px-6" id="sendBtn"><i class="fa fa-send"></i>发送</button>
</div>
<div class="flex items-center gap-3 mt-2">
<div id="progressBar" class="flex-1 bg-tech-card rounded-full h-1.5 overflow-hidden hidden">
<div id="progressFill" class="bg-[#22d3ee] h-full rounded-full transition-all" style="width:0%"></div>
</div>
<p id="progressText" class="text-tech-text/40 text-xs hidden">等待中...</p>
</div>
</div>
</div>

<!-- 右侧：示例问题 -->
<div class="glass p-3 flex flex-col" style="width:200px;flex-shrink:0;">
<h4 class="text-xs font-bold mb-3"><i class="fa fa-lightbulb-o text-[#22d3ee] mr-1.5"></i>示例</h4>
<div class="flex flex-col gap-1.5 text-xs">
<button onclick="quickQuestion('赵玖是什么角色？')" class="text-left px-2 py-1.5 rounded-lg bg-tech-card hover:bg-tech-main/10 transition text-tech-text/70">赵玖是什么角色？</button>
<button onclick="quickQuestion('赵玖和岳飞是什么关系？')" class="text-left px-2 py-1.5 rounded-lg bg-tech-card hover:bg-tech-main/10 transition text-tech-text/70">赵玖和岳飞的关系？</button>
<button onclick="quickQuestion('韩世忠的主要事迹')" class="text-left px-2 py-1.5 rounded-lg bg-tech-card hover:bg-tech-main/10 transition text-tech-text/70">韩世忠的主要事迹</button>
<button onclick="quickQuestion('全书的核心主题是什么？')" class="text-left px-2 py-1.5 rounded-lg bg-tech-card hover:bg-tech-main/10 transition text-tech-text/70">全书核心主题</button>
<button onclick="quickQuestion('赵玖在八公山上做了什么？')" class="text-left px-2 py-1.5 rounded-lg bg-tech-card hover:bg-tech-main/10 transition text-tech-text/70">赵玖在八公山？</button>
</div>
</div>
</main>

<script>
/* ================================================================
   消息数据结构
   ================================================================ */
let sessions = [];
let currentSessionId = null;
let _streamingAbort = null;

const STORAGE_KEY = 'novelgraph_chat_sessions';

function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  } catch(e) { sessions = []; }
  if (!sessions.length) newSession();
}

function saveSessions() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  } catch(e) {}
}

function newSession() {
  const id = 's_' + Date.now();
  sessions.unshift({ id, title: '新对话', messages: [], created: Date.now() });
  currentSessionId = id;
  saveSessions();
  renderSessionList();
  switchSession(id);
}

function switchSession(id) {
  currentSessionId = id;
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  renderMessages(session.messages);
  document.getElementById('sessionTitle').textContent = session.title;
  document.getElementById('msgCount').textContent = session.messages.length + ' 条消息';
  renderSessionList();
}

function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (sessions.length === 0) newSession();
  else switchSession(sessions[0].id);
}

function clearAllSessions() {
  if (!confirm('确定清空所有会话？')) return;
  sessions = [];
  saveSessions();
  newSession();
}

function getCurrentSession() {
  return sessions.find(s => s.id === currentSessionId);
}

function addMessageToSession(role, text, sources) {
  const session = getCurrentSession();
  if (!session) return;
  session.messages.push({ role, text, sources: sources || [], timestamp: Date.now() });
  // 根据首条问题更新标题
  if (session.messages.length === 1 && role === 'user') {
    session.title = text.length > 20 ? text.slice(0, 18) + '…' : text;
  }
  saveSessions();
  renderSessionList();
}

function updateLastMessage(text, done) {
  const session = getCurrentSession();
  if (!session || !session.messages.length) return;
  const last = session.messages[session.messages.length - 1];
  if (last.role !== 'assistant') return;
  last.text = text;
  if (done) saveSessions();
  renderMessages(session.messages);
}

/* ================================================================
   渲染
   ================================================================ */

function renderSessionList() {
  const el = document.getElementById('sessionList');
  el.innerHTML = sessions.map(s =>
    `<div class="flex items-center gap-1 p-1.5 rounded-lg cursor-pointer transition ${s.id === currentSessionId ? 'bg-tech-main/15 text-white' : 'text-tech-text/60 hover:bg-tech-card'}" onclick="switchSession('${s.id}')">
      <i class="fa fa-comment-o text-xs flex-shrink-0"></i>
      <span class="text-xs truncate flex-1">${s.title}</span>
      <span class="text-[10px] text-tech-text/40">${s.messages.length}</span>
      <button onclick="event.stopPropagation();deleteSession('${s.id}')" class="text-tech-text/30 hover:text-red-400 text-xs ml-auto">&times;</button>
    </div>`
  ).join('');
}

function renderMessages(messages) {
  const el = document.getElementById('chatMessages');
  el.innerHTML = messages.map(m => renderMessage(m)).join('');
  el.scrollTop = el.scrollHeight;
}

function renderMessage(m) {
  if (m.role === 'user') return renderUserMessage(m.text);
  return renderAssistantMessage(m.text, m.sources);
}

function renderUserMessage(text) {
  const esc = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="flex justify-end">
    <div class="max-w-[80%] p-3.5 rounded-xl bg-[#22d3ee]/20 border border-[#22d3ee]/30">
      <p class="text-sm leading-relaxed" style="white-space:pre-wrap">${esc}</p>
    </div>
  </div>`;
}

function renderAssistantMessage(text, sources) {
  const html = renderMarkdown(text);
  const srcHtml = (sources && sources.length) ? `<div class="mt-2 pt-2 border-t border-tech-border/50 text-[10px] text-tech-text/40">📎 ${sources.join('、')}</div>` : '';
  return `<div class="flex justify-start">
    <div class="max-w-[85%] p-3.5 rounded-xl glass">
      <div class="message-text text-sm leading-relaxed">${html}</div>
      ${srcHtml}
    </div>
  </div>`;
}

/* ── 简易 Markdown 渲染 ── */
function renderMarkdown(text) {
  let html = text
    .replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // 代码块
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre class="bg-tech-card p-2 rounded-lg text-xs my-2 overflow-x-auto"><code>$2</code></pre>')
    // 行内代码
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // 三级标题
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    // 二级标题
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    // 加粗
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    // 无序列表
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // 引用来源：仅 "引自第X章" 可点击，其他「」保持原样
    .replace(/「((?:引自|出自).+?)」/g, '<span class="citation" onclick="showChapterModal(\'$1\')">「$1」</span>');

  // 包 ul
  html = html.replace(/(<li>.*?<\/li>\n?)+/g, '<ul>$&</ul>');
  return html;
}

function showChapterModal(keyword) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-50 flex items-center justify-center';
  overlay.style.background = 'rgba(0,0,0,0.7)';
  overlay.innerHTML = `<div class="bg-[#1a1f2e] border border-[#22d3ee]/20 rounded-xl w-[700px] max-h-[80vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between p-4 border-b border-tech-border">
      <h3 class="font-bold"><i class="fa fa-file-text-o text-[#22d3ee] mr-2"></i>原文检索：<span class="text-tech-text/60 text-sm">${keyword}</span></h3>
      <button onclick="this.closest('.fixed').remove()" class="text-tech-text/50 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div id="chapterContent" class="flex-1 overflow-y-auto p-5 text-sm leading-relaxed" style="white-space:pre-wrap;max-height:65vh;">
      <div class="text-center text-tech-text/40 py-8"><i class="fa fa-spinner fa-pulse mr-2"></i>查询中...</div>
    </div>
  </div>`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);

  // 请求原文
  AUTH.apiFetch('/api/chapter?keyword=' + encodeURIComponent(keyword) + '&novel=绍宋作者：榴弹怕水')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('chapterContent');
      if (!data.chapters || !data.chapters.length) {
        el.innerHTML = '<div class="text-center text-tech-text/40 py-8">未找到匹配的原文内容。</div>';
        return;
      }
      el.innerHTML = data.chapters.map(ch =>
        `<div class="mb-4 p-3 rounded-lg bg-tech-card">
          <div class="font-bold text-[#22d3ee] mb-1">${ch.chapter_title}</div>
          <div class="text-tech-text/80">${ch.snippet}</div>
          <div class="text-tech-text/30 text-[10px] mt-1">${ch.text_length} 字</div>
        </div>`
      ).join('');
    })
    .catch(() => {
      document.getElementById('chapterContent').innerHTML = '<div class="text-center text-tech-text/40 py-8">查询失败。</div>';
    });
}

/* ================================================================
   流式问答
   ================================================================ */

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentSessionId) return;
  input.value = '';

  addMessageToSession('user', text);
  renderMessages(getCurrentSession().messages);

  const session = getCurrentSession();
  session.messages.push({ role: 'assistant', text: '', sources: [], timestamp: Date.now() });
  renderMessages(session.messages);
  document.getElementById('msgCount').textContent = session.messages.length + ' 条消息';

  showProgress(true, '分析中...');

  try {
    const resp = await AUTH.apiFetch('/api/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text, session_id: currentSessionId })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      // SSE: data: {...}\n\n
      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        const lines = part.split('\n').filter(l => l.startsWith('data: '));
        for (const line of lines) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') { showProgress(false); return; }

          try {
            const parsed = JSON.parse(data);
            if (parsed.event === 'progress') {
              showProgress(true, parsed.message || '处理中...');
            } else if (parsed.event === 'result') {
              fullText = parsed.report || '';
              const sources = [];
              const srcMatch = fullText.match(/「[^」]+」/g);
              if (srcMatch) srcMatch.forEach(s => {
                const clean = s.replace(/[「」]/g,'');
                if(!sources.includes(clean)) sources.push(clean);
              });
              const msgs = getCurrentSession().messages;
              if (msgs.length && msgs[msgs.length-1].role === 'assistant') {
                msgs[msgs.length-1].text = fullText;
                msgs[msgs.length-1].sources = sources;
              }
              renderMessages(getCurrentSession().messages);
              document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
              saveSessions();
            }
          } catch(e) {}
        }
      }
    }
  } catch(e) {
    const msgs = getCurrentSession().messages;
    if (msgs.length && msgs[msgs.length-1].role === 'assistant') {
      msgs[msgs.length-1].text = '网络错误: ' + e.message;
      renderMessages(msgs);
    }
  }
  showProgress(false);
}

function showProgress(show, text) {
  document.getElementById('progressBar').classList.toggle('hidden', !show);
  document.getElementById('progressText').classList.toggle('hidden', !show);
  if (text) document.getElementById('progressText').textContent = text;
  document.getElementById('sendBtn').disabled = show;
}

function quickQuestion(q) {
  document.getElementById('chatInput').value = q;
  sendMessage();
}

// 初始化
loadSessions();
if (sessions.length) switchSession(sessions[0].id);
</script>
</body>
</html>
