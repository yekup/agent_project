<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传解析 - NovelGraph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script src="/static/js/auth.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { tech: { main: '#22d3ee', dark: '#0891b2', bg: '#0c1222', card: 'rgba(255,255,255,0.05)', border: 'rgba(34,211,238,0.2)', text: '#e2e8f0' } },
          boxShadow: { glow: '0 0 18px rgba(34,211,238,0.15)' }
        }
      }
    }
  </script>
  <style>
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.05); border: 1px solid rgba(34,211,238,0.2); border-radius: 12px; }
    .btn-tech { background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.4); color: #22d3ee; padding: 8px 20px; border-radius: 8px; transition: all 0.3s; cursor: pointer; }
    .btn-tech:hover { background: rgba(34,211,238,0.2); box-shadow: 0 0 18px rgba(34,211,238,0.15); }
    .btn-solid { background: #22d3ee; color: #0c1222; padding: 8px 20px; border-radius: 8px; transition: all 0.3s; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-solid:hover { background: #0891b2; box-shadow: 0 0 18px rgba(34,211,238,0.15); }
    .btn-solid:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    .nav-link { padding: 8px 16px; border-radius: 8px; color: rgba(226,232,240,0.7); transition: all 0.3s; }
    .nav-link:hover { color: #22d3ee; background: rgba(34,211,238,0.05); }
    .nav-active { color: #22d3ee; background: rgba(34,211,238,0.1); }
    .upload-box { border: 2px dashed rgba(34,211,238,0.2); border-radius: 12px; padding: 40px; text-align: center; transition: all 0.3s; cursor: pointer; }
    .upload-box:hover { border-color: rgba(34,211,238,0.6); box-shadow: 0 0 18px rgba(34,211,238,0.15); }
    body { background: #0c1222; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <nav class="glass mx-6 mt-6 px-6 py-3 sticky top-0 z-50">
    <div class="flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <i class="fa fa-sitemap text-[#22d3ee] text-2xl"></i>
        <span class="text-xl font-bold tracking-wide">NovelGraph</span>
      </a>
      <div class="flex gap-2">
        <a href="/" class="nav-link" data-perm="page:dashboard"><i class="fa fa-home mr-1.5"></i>首页</a>
        <a href="/upload" class="nav-link nav-active" data-perm="page:upload"><i class="fa fa-upload mr-1.5"></i>上传解析</a>
        <a href="/graph" class="nav-link" data-perm="page:graph"><i class="fa fa-share-alt mr-1.5"></i>关系图谱</a>
        <a href="/chat" class="nav-link" data-perm="page:chat"><i class="fa fa-commenting mr-1.5"></i>AI问答</a>
      </div>
      <div class="flex items-center gap-3">
        <span id="userInfo" class="text-sm text-tech-text/60"></span>
        <a href="/login" id="loginBtn" class="btn-tech text-sm">登录</a>
        <button id="logoutBtn" onclick="AUTH.logout()" class="btn-tech text-sm hidden">登出</button>
      </div>
    </div>
  </nav>

  <main class="flex-1 px-8 py-12 max-w-4xl mx-auto w-full">
    <h2 class="text-3xl font-bold mb-3">文档智能解析</h2>
    <p class="text-tech-text/60 mb-8">上传 TXT 文档，自动清洗、分块、编译，生成结构化知识图谱</p>

    <div id="step1" class="glass p-8 mb-6">
      <h3 class="text-lg font-bold mb-4"><i class="fa fa-file mr-2 text-[#22d3ee]"></i>选择文件</h3>
      <p class="text-tech-text/60 text-sm mb-4">支持格式: TXT / Word (.docx) / PDF / Markdown</p>
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <i class="fa fa-cloud-upload text-5xl text-tech-text/30 mb-4"></i>
        <p class="text-tech-text/60" id="fileLabel">点击选择或拖拽文件到此处</p>
        <input type="file" id="fileInput" accept=".txt,.docx,.doc,.pdf,.md" class="hidden" onchange="onFileSelect(event)">
      </div>
      <div class="flex items-center gap-3 mt-6">
        <button id="uploadBtn" onclick="uploadFile()" disabled class="btn-solid"><i class="fa fa-upload mr-2"></i>上传并解析</button>
        <span id="uploadProgress" class="text-sm text-tech-text/60 hidden"></span>
      </div>
    </div>

    <div id="step15" class="glass p-8 mb-6 hidden">
      <h3 class="text-lg font-bold mb-4"><i class="fa fa-check-circle text-green-400 mr-2"></i>解析结果</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-tech-card rounded-lg p-4 text-center border border-tech-border">
          <div class="text-3xl font-bold text-[#22d3ee]" id="infoChapters">0</div>
          <div class="text-xs text-tech-text/60 mt-1">章节</div>
        </div>
        <div class="bg-tech-card rounded-lg p-4 text-center border border-tech-border">
          <div class="text-3xl font-bold text-green-400" id="infoChunks">0</div>
          <div class="text-xs text-tech-text/60 mt-1">语义块</div>
        </div>
        <div class="bg-tech-card rounded-lg p-4 text-center border border-tech-border">
          <div class="text-3xl font-bold text-yellow-400" id="infoFormat">-</div>
          <div class="text-xs text-tech-text/60 mt-1">格式</div>
        </div>
        <div class="bg-tech-card rounded-lg p-4 text-center border border-tech-border">
          <div class="text-3xl font-bold text-purple-400" id="infoSize">0MB</div>
          <div class="text-xs text-tech-text/60 mt-1">大小</div>
        </div>
      </div>
    </div>

    <div id="step2" class="glass p-8 mb-6 hidden">
      <h3 class="text-lg font-bold mb-4"><i class="fa fa-cog mr-2 text-[#22d3ee]"></i>选择编译章节</h3>
      <p class="text-tech-text/60 mb-4">共 <span id="totalChapters" class="text-white font-bold">0</span> 章</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-tech-card rounded-lg p-5 border border-tech-border">
          <div class="flex items-center gap-2 mb-3">
            <i class="fa fa-list-ol text-[#22d3ee]"></i>
            <span class="font-bold">全部编译</span>
          </div>
          <p class="text-tech-text/50 text-xs mb-3">完整编译全书所有章节</p>
          <button onclick="buildChapters()" class="btn-solid w-full"><i class="fa fa-play mr-2"></i>编译全部</button>
        </div>
        <div class="bg-tech-card rounded-lg p-5 border border-tech-border">
          <div class="flex items-center gap-2 mb-3">
            <i class="fa fa-filter text-yellow-400"></i>
            <span class="font-bold">范围编译</span>
          </div>
          <p class="text-tech-text/50 text-xs mb-3">指定起始和结束章节，只编译中间部分</p>
          <div class="flex gap-2 mb-3">
            <input type="number" id="rangeStart" placeholder="起始章" class="w-1/2 px-3 py-2 rounded-lg bg-tech-card border border-tech-border text-white text-sm" min="1">
            <span class="text-tech-text/40 self-center">至</span>
            <input type="number" id="rangeEnd" placeholder="结束章" class="w-1/2 px-3 py-2 rounded-lg bg-tech-card border border-tech-border text-white text-sm" min="1">
          </div>
          <button onclick="buildRange()" class="btn-tech w-full justify-center"><i class="fa fa-filter mr-2"></i>开始编译</button>
        </div>
      </div>
    </div>

    <div id="step3" class="glass p-8 mb-6 hidden">
      <h3 class="text-lg font-bold mb-4"><i id="progressIcon" class="fa fa-spinner fa-pulse mr-2 text-[#22d3ee]"></i>编译进度</h3>
      <div class="w-full bg-tech-card rounded-full h-3 mb-3 border border-tech-border">
        <div id="progressBar" class="bg-[#22d3ee] h-3 rounded-full transition-all" style="width:0%"></div>
      </div>
      <div class="flex items-center gap-3">
        <p id="progressText" class="text-tech-text/60 text-sm">等待中...</p>
        <div id="pauseControls" class="flex gap-2 hidden">
          <button id="pauseBtn" onclick="togglePause()" class="btn-tech text-sm"><i class="fa fa-pause mr-1"></i>暂停</button>
          <button id="resumeBtn" onclick="togglePause()" class="btn-solid text-sm hidden"><i class="fa fa-play mr-1"></i>继续</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ── 编译状态 ──
    let currentFilename = '';       // 当前上传的文件名
    let _buildNovelName = '';       // 后端返回的小说 key
    let _progressTimer = null;      // 进度轮询定时器
    let _paused = false;            // 暂停状态

    function onFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileLabel').textContent = file.name;
        document.getElementById('uploadBtn').disabled = false;
      }
    }

    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;
      document.getElementById('uploadProgress').classList.remove('hidden');
      document.getElementById('uploadProgress').textContent = '上传并解析中...';
      document.getElementById('uploadBtn').disabled = true;
      const formData = new FormData();
      formData.append('file', file);
      const resp = await AUTH.apiFetch('/api/upload', { method: 'POST', body: formData });
      const data = await resp.json();
      if (resp.ok) {
        currentFilename = data.filename;
        document.getElementById('totalChapters').textContent = data.total_chapters;
        document.getElementById('infoChapters').textContent = data.total_chapters;
        document.getElementById('infoChunks').textContent = data.total_chunks || '-';
        document.getElementById('infoFormat').textContent = data.format || 'txt';
        document.getElementById('infoSize').textContent = (data.file_info?.size_mb || 0).toFixed(2) + 'MB';
        document.getElementById('step15').classList.remove('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('uploadProgress').textContent = '✅ ' + data.message;
      } else {
        document.getElementById('uploadProgress').textContent = '❌ ' + (data.detail || '上传失败');
      }
    }

    async function togglePause() {
      if (!_buildNovelName) return;
      _paused = !_paused;
      const endpoint = _paused ? '/api/build/pause' : '/api/build/resume';
      await AUTH.apiFetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ novel: _buildNovelName })
      });
      document.getElementById('pauseBtn').classList.toggle('hidden');
      document.getElementById('resumeBtn').classList.toggle('hidden');
      document.getElementById('progressIcon').className = _paused
        ? 'fa fa-pause mr-2 text-yellow-400'
        : 'fa fa-spinner fa-pulse mr-2 text-[#22d3ee]';
    }

    async function buildRange() {
      const start = parseInt(document.getElementById('rangeStart').value);
      const end = parseInt(document.getElementById('rangeEnd').value);
      if (!start || !end || start < 1 || end < start) {
        alert('请输入有效的章节范围（起始章 ≤ 结束章）');
        return;
      }
      startBuild({ start_chapter: start, end_chapter: end });
    }

    async function buildChapters() {
      startBuild({ chapters: -1 });
    }

    async function startBuild(params) {
      document.getElementById('step3').classList.remove('hidden');
      document.getElementById('progressBar').style.width = '5%';
      document.getElementById('progressText').innerHTML = '⏳ 开始编译...';

      params.filename = currentFilename;
      const resp = await AUTH.apiFetch('/api/build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params)
      });
      const data = await resp.json();
      if (!resp.ok) {
        document.getElementById('progressText').textContent = '❌ 启动失败: ' + (data.detail || '');
        return;
      }

      _buildNovelName = data.novel;
      document.getElementById('pauseControls').classList.remove('hidden');

      if (_progressTimer) clearInterval(_progressTimer);
      _progressTimer = setInterval(async () => {
        try {
          const pr = await AUTH.apiFetch('/api/build/progress?novel=' + encodeURIComponent(_buildNovelName));
          const pd = await pr.json();
          const pct = pd.build_complete ? 100 : Math.max(5, pd.progress);
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('progressText').innerHTML =
            pd.build_complete
              ? '✅ 编译完成，共 ' + pd.total + ' 章<br><a href="/graph" class="text-[#22d3ee] hover:underline mt-2 inline-block">→ 前往查看图谱</a>'
              : '⏳ 编译中... ' + pd.completed + '/' + pd.total + ' 章 (' + pd.progress + '%)';
          if (pd.build_complete) {
            clearInterval(_progressTimer);
            _progressTimer = null;
            document.getElementById('pauseControls').classList.add('hidden');
            document.getElementById('progressBar').style.width = '100%';
          }
        } catch (e) {}
      }, 2000);
    }
  </script>
</body>
</html>
