<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 网文图谱分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg border border-gray-700 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-2 text-center">📖 网文图谱分析系统</h1>
        <p class="text-gray-400 text-center mb-6">请登录以继续</p>

        <div id="errorMsg" class="bg-red-900/50 text-red-300 p-3 rounded mb-4 hidden"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">用户名</label>
                <input type="text" id="username" value="admin"
                    class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">密码</label>
                <input type="password" id="password" value="admin123"
                    class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-blue-500 focus:outline-none">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold transition">
                登录
            </button>
        </form>

        <p class="text-gray-500 text-xs text-center mt-4">
            默认管理员: admin / admin123
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            const errorEl = document.getElementById('errorMsg')

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password}),
                })
                const data = await resp.json()

                if (resp.ok) {
                    localStorage.setItem('token', data.token)
                    localStorage.setItem('user', JSON.stringify(data.user))
                    window.location.href = '/'
                } else {
                    errorEl.textContent = data.detail || '登录失败'
                    errorEl.classList.remove('hidden')
                }
            } catch (err) {
                errorEl.textContent = '网络错误: ' + err.message
                errorEl.classList.remove('hidden')
            }
        })
    </script>
</body>
</html>
