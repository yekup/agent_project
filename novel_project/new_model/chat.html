<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI问答 - NovelGraph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              main: '#22d3ee',
              dark: '#0891b2',
              bg: '#0c1222',
              card: 'rgba(255,255,255,0.05)',
              border: 'rgba(34,211,238,0.2)',
              text: '#e2e8f0'
            }
          },
          boxShadow: {
            'glow': '0 0 18px rgba(34,211,238,0.15)'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .glass { @apply backdrop-blur-md bg-tech-card border border-tech-border rounded-xl; }
      .btn-tech { @apply bg-tech-main/10 border border-tech-main/40 text-tech-main px-4 py-1.5 rounded-lg hover:bg-tech-main/20 hover:shadow-glow transition-all duration-300; }
      .btn-solid { @apply bg-tech-main text-tech-bg px-4 py-1.5 rounded-lg hover:bg-tech-dark hover:shadow-glow transition-all duration-300; }
      .nav-link { @apply px-4 py-2 rounded-lg text-tech-text/70 hover:text-tech-main hover:bg-tech-main/5 transition-all; }
      .nav-active { @apply text-tech-main bg-tech-main/10; }
      .scroll-hide::-webkit-scrollbar { display: none; }
      .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    }
    body { @apply bg-tech-bg text-tech-text h-screen flex flex-col overflow-hidden; }
  </style>
</head>
<body class="flex flex-col h-screen">
  <nav class="glass mx-6 mt-6 px-6 py-3 z-50">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <i class="fa fa-sitemap text-tech-main text-2xl"></i>
        <span class="text-xl font-bold tracking-wide">NovelGraph</span>
      </a>
      <div class="flex gap-2">
        <a href="index.html" class="nav-link">首页</a>
        <a href="upload.html" class="nav-link">上传解析</a>
        <a href="graph.html" class="nav-link">关系图谱</a>
        <a href="chat.html" class="nav-link nav-active">AI问答</a>
      </div>
      <div class="text-tech-text/60 text-sm">Admin</div>
    </div>
  </nav>

  <main class="flex-1 flex mx-6 my-4 gap-4">
    <!-- 左侧对话列表 -->
    <aside class="w-[240px] glass p-4 flex flex-col">
      <h3 class="font-medium text-tech-main mb-4">对话列表</h3>
      <div class="flex-1 overflow-y-auto scroll-hide space-y-2 text-sm">
        <div class="p-2 rounded-lg bg-tech-main/5 border border-tech-border hover:border-tech-main/40 cursor-pointer">绍宋人物考据</div>
        <div class="p-2 rounded-lg bg-tech-main/5 border border-tech-border hover:border-tech-main/40 cursor-pointer">势力派系梳理</div>
        <div class="p-2 rounded-lg bg-tech-main/5 border border-tech-border hover:border-tech-main/40 cursor-pointer">人物关系查询</div>
      </div>
      <button class="btn-solid w-full mt-4 text-sm"><i class="fa fa-plus mr-1"></i>新建对话</button>
    </aside>

    <!-- 右侧聊天 -->
    <section class="flex-1 glass flex flex-col overflow-hidden">
      <div class="flex-1 p-6 overflow-y-auto scroll-hide space-y-6">
        <!-- AI -->
        <div class="flex gap-3">
          <div class="w-9 h-9 rounded-full bg-tech-main/20 flex items-center justify-center text-tech-main shrink-0">
            <i class="fa fa-robot"></i>
          </div>
          <div class="bg-tech-main/5 border border-tech-border rounded-xl p-4 text-sm max-w-[75%]">
            已加载当前小说图谱知识库，你可以查询人物关系、势力矛盾、剧情脉络、官职体系等问题，我将基于原文真实回答。
          </div>
        </div>
        <!-- 用户 -->
        <div class="flex gap-3 justify-end">
          <div class="bg-tech-main/15 border border-tech-border rounded-xl p-4 text-sm max-w-[75%]">
            赵玖的核心执政团队有哪些人？
          </div>
          <div class="w-9 h-9 rounded-full bg-tech-main flex items-center justify-center text-tech-bg shrink-0">
            <i class="fa fa-user"></i>
          </div>
        </div>
      </div>
      <!-- 输入框 -->
      <div class="p-4 border-t border-tech-border">
        <div class="flex gap-3">
          <textarea placeholder="输入你的问题..." class="flex-1 h-[90px] bg-transparent border border-tech-border rounded-lg p-3 text-sm outline-none focus:border-tech-main/60 resize-none"></textarea>
          <button class="btn-solid h-fit"><i class="fa fa-paper-plane mr-1"></i>发送</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
