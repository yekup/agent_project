<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传解析 - NovelGraph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tech: {
              main: '#22d3ee',
              dark: '#0891b2',
              bg: '#0c1222',
              card: 'rgba(255,255,255,0.05)',
              border: 'rgba(34,211,238,0.2)',
              text: '#e2e8f0'
            }
          },
          boxShadow: {
            'glow': '0 0 18px rgba(34,211,238,0.15)'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .glass { @apply backdrop-blur-md bg-tech-card border border-tech-border rounded-xl; }
      .btn-tech { @apply bg-tech-main/10 border border-tech-main/40 text-tech-main px-5 py-2 rounded-lg hover:bg-tech-main/20 hover:shadow-glow transition-all duration-300; }
      .btn-solid { @apply bg-tech-main text-tech-bg px-5 py-2 rounded-lg hover:bg-tech-dark hover:shadow-glow transition-all duration-300; }
      .nav-link { @apply px-4 py-2 rounded-lg text-tech-text/70 hover:text-tech-main hover:bg-tech-main/5 transition-all; }
      .nav-active { @apply text-tech-main bg-tech-main/10; }
      .upload-box { @apply border-2 border-dashed border-tech-border rounded-xl p-10 text-center hover:border-tech-main/60 hover:shadow-glow transition-all; }
    }
    body { @apply bg-tech-bg text-tech-text min-h-screen flex flex-col; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <nav class="glass mx-6 mt-6 px-6 py-3 sticky top-0 z-50">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <i class="fa fa-sitemap text-tech-main text-2xl"></i>
        <span class="text-xl font-bold tracking-wide">NovelGraph</span>
      </a>
      <div class="flex gap-2">
        <a href="index.html" class="nav-link">首页</a>
        <a href="upload.html" class="nav-link nav-active">上传解析</a>
        <a href="graph.html" class="nav-link">关系图谱</a>
        <a href="chat.html" class="nav-link">AI问答</a>
      </div>
      <div class="text-tech-text/60 text-sm">Admin</div>
    </div>
  </nav>

  <main class="flex-1 px-8 py-12 max-w-4xl mx-auto w-full">
    <h2 class="text-3xl font-bold mb-3">文档智能解析</h2>
    <p class="text-tech-text/60 mb-8">上传小说文件，自动抽取人物、派系、关系，生成可视化图谱</p>

    <div class="upload-box mb-8 bg-tech-card/40">
      <i class="fa fa-cloud-upload text-tech-main text-5xl mb-4"></i>
      <h3 class="text-xl mb-2">点击或拖拽文件上传</h3>
      <p class="text-tech-text/50 text-sm">支持 TXT / PDF ｜ 会员支持扫描件OCR离线识别</p>
      <input type="file" class="hidden" accept=".txt,.pdf">
    </div>

    <div class="glass p-6 mb-8">
      <h3 class="font-semibold mb-4 text-tech-main">文件解析能力说明</h3>
      <div class="space-y-3 text-sm text-tech-text/70">
        <p><i class="fa fa-check text-emerald-400 mr-2"></i>纯文本 / 可复制PDF：极速解析，零误差抽取正文</p>
        <p><i class="fa fa-check text-emerald-400 mr-2"></i>扫描件PDF：本地PaddleOCR离线识别，无需付费API</p>
        <p><i class="fa fa-check text-emerald-400 mr-2"></i>自动降噪、矫正、排版修复，适配老旧实体书扫描件</p>
      </div>
    </div>

    <div class="flex gap-4">
      <button class="btn-solid">开始生成图谱</button>
      <a href="graph.html" class="btn-tech">查看已有图谱</a>
    </div>
  </main>

  <footer class="text-center py-6 text-tech-text/40 text-sm">
    NovelGraph · 离线OCR + AI结构化抽取
  </footer>
</body>
</html>
