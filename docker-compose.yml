version: "3.9"

services:
  # ===== 主应用 =====
  app:
    build: .
    container_name: novel-graphrag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 应用运行数据（wiki/图谱/记忆等，CWD 为 /app/novel_project）
      - ./novel_project/data:/app/novel_project/data
      # 仓库级数据（JWT 密钥、日志等，按 REPO_ROOT 解析）
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: novel-graphrag-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
