<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<script>
tailwind.config={theme:{extend:{colors:{tech:{main:'#22d3ee',dark:'#0891b2',bg:'#0c1222',card:'rgba(255,255,255,0.05)',border:'rgba(34,211,238,0.2)',text:'#e2e8f0'}},boxShadow:{glow:'0 0 18px rgba(34,211,238,0.15)'}}}}
</script>
<style>
@layer utilities{.glass{backdrop-filter:blur(12px);background:rgba(255,255,255,0.05);border:1px solid rgba(34,211,238,0.2);border-radius:12px}.btn-tech{background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.4);color:#22d3ee;padding:4px 16px;border-radius:8px;transition:all 0.3s}.btn-tech:hover{background:rgba(34,211,238,0.2)}.btn-solid{background:#22d3ee;color:#0c1222;padding:4px 16px;border-radius:8px;transition:all 0.3s;font-weight:bold}.btn-solid:hover{background:#0891b2}.nav-link{padding:8px 16px;border-radius:8px;color:rgba(226,232,240,0.7);transition:all 0.3s}.nav-link:hover{color:#22d3ee;background:rgba(34,211,238,0.05)}.nav-active{color:#22d3ee;background:rgba(34,211,238,0.1)}}
body{background:#0c1222;color:#e2e8f0;min-height:100vh;font-family:system-ui,sans-serif}
#graphContainer{background:#0c1222!important;width:100%;height:620px;border-radius:12px;overflow:hidden}
#graphContainer canvas{width:100%;height:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-panel{background:#1a1f2e;border:1px solid rgba(34,211,238,0.2);border-radius:12px;padding:24px;min-width:400px;max-width:480px}
.modal-panel h3{font-size:18px;font-weight:bold;margin-bottom:16px}
.modal-option{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(34,211,238,0.1)}
.modal-option:last-child{border-bottom:none}
.modal-option label{color:#9ca3af;font-size:14px}
.node-tooltip{position:absolute;background:#1a1f2e;color:#e2e8f0;border:1px solid rgba(34,211,238,0.3);border-radius:6px;padding:6px 10px;font-size:13px;pointer-events:none;z-index:10}
</style>
</head>
<body>
<nav class="glass mx-6 mt-6 px-6 py-3 sticky top-0 z-50">
<div class="flex items-center justify-between">
<a href="/" class="flex items-center gap-3"><i class="fa fa-sitemap text-[#22d3ee] text-2xl"></i><span class="text-xl font-bold tracking-wide">NovelGraph</span></a>
<div class="flex gap-2">
<a href="/" class="nav-link" data-perm="page:dashboard"><i class="fa fa-home mr-1.5"></i>首页</a>
<a href="/upload" class="nav-link" data-perm="page:upload"><i class="fa fa-upload mr-1.5"></i>上传解析</a>
<a href="/graph" class="nav-link nav-active" data-perm="page:graph"><i class="fa fa-share-alt mr-1.5"></i>关系图谱</a>
<a href="/chat" class="nav-link" data-perm="page:chat"><i class="fa fa-commenting mr-1.5"></i>AI问答</a>
</div>
<div class="flex items-center gap-3">
<span id="userInfo" class="text-sm text-tech-text/60"></span>
<a href="/login" id="loginBtn" class="btn-tech text-sm">登录</a>
<button id="logoutBtn" onclick="AUTH.logout()" class="btn-tech text-sm hidden">登出</button>
</div>
</div>

<main class="p-6">
<div class="flex items-center justify-between mb-4 flex-wrap gap-2">
<h2 class="text-2xl font-bold"><i class="fa fa-sitemap text-[#22d3ee] mr-2"></i>人物关系图谱</h2>
<div class="flex items-center space-x-3 flex-wrap gap-2">
<select id="novelSelector" onchange="switchNovel()" class="px-3 py-1.5 rounded-lg bg-tech-card border border-tech-border text-white text-sm outline-none focus:border-[#22d3ee]"><option value="">-- 选择 --</option></select>
<input type="text" id="searchNode" placeholder="搜索人物..." class="px-3 py-1.5 rounded-lg bg-tech-card border border-tech-border text-white text-sm w-28 outline-none focus:border-[#22d3ee]">
<button onclick="filterNode()" class="btn-tech text-sm"><i class="fa fa-search mr-1"></i>聚焦</button>
<button onclick="resetView()" class="btn-tech text-sm"><i class="fa fa-arrows-alt mr-1"></i>全图</button>
<button onclick="openExportDialog()" class="btn-solid text-sm"><i class="fa fa-download mr-1"></i>导出</button>
<button id="editToggle" onclick="toggleEditMode()" class="btn-tech text-sm hidden" data-perm="action:edit"><i class="fa fa-pencil mr-1"></i>编辑</button>
<select id="roleFilter" onchange="filterByRole()" class="px-3 py-1.5 rounded-lg bg-tech-card border border-tech-border text-white text-sm outline-none focus:border-[#22d3ee]">
<option value="all">全部</option><option value="主角">主角</option><option value="配角">配角</option>
</select>
<select id="isolatedToggle" onchange="resetView()" class="px-2 py-1.5 rounded-lg bg-tech-card border border-tech-border text-white text-sm outline-none">
<option value="connected">仅关联实体</option><option value="all">显示全部节点</option>
</select>
</div></div>
<div class="relative">
<div id="graphContainer"></div>
<div id="graphEmpty" class="flex flex-col items-center justify-center text-center" style="display:none;height:620px;">
<i class="fa fa-sitemap text-6xl text-tech-text/20 mb-4"></i>
<h3 class="text-xl font-bold text-tech-text/50 mb-2">暂无图谱数据</h3>
<p class="text-tech-text/30 text-sm max-w-md">请先上传并编译小说，图谱数据将在编译完成后自动生成。</p>
<a href="/upload" class="btn-solid mt-6"><i class="fa fa-upload mr-2"></i>前往上传</a>
</div>
<div id="nodeDetail" class="absolute top-2 right-2 z-20" style="width:380px;max-height:618px;display:none;flex-direction:column;background:#1a1f2e;border:1px solid rgba(34,211,238,0.25);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.5);">
<div class="p-4 pb-2 border-b border-tech-border flex-shrink-0" style="border-radius:12px 12px 0 0;">
<div class="flex items-center justify-between">
<h3 id="detailName" class="text-lg font-bold"></h3>
<button onclick="closeDetail()" class="text-tech-text/50 hover:text-white text-lg leading-none">&times;</button>
</div>
<p id="detailRole" class="text-tech-text/60 text-xs mt-0.5"></p>
<p id="detailCount" class="text-tech-text/60 text-xs mt-1"></p>
</div>
<div class="flex-shrink-0 px-4 pt-3 pb-1"><h4 class="text-sm text-tech-text/70">关联关系 <span id="relCount" class="text-tech-text/50 font-normal"></span></h4></div>
<div id="detailRelations" class="px-4 pb-3 overflow-y-auto flex-1" style="max-height:360px;scrollbar-width:thin;scrollbar-color:#4b5563 transparent;"></div>
<div id="relPagination" class="flex-shrink-0 px-4 pb-3 pt-1 hidden">
<div class="flex items-center justify-between text-xs text-tech-text/60">
<button id="relPrev" onclick="prevRelPage()" class="btn-tech px-2 py-1 text-xs disabled:opacity-30" disabled>上一页</button>
<span id="relPageInfo"></span>
<button id="relNext" onclick="nextRelPage()" class="btn-tech px-2 py-1 text-xs disabled:opacity-30">下一页</button>
</div></div></div></div>
<div class="flex justify-between items-center mt-2">
<p id="graphInfo" class="text-sm text-tech-text/50"></p>
<div class="flex space-x-4 text-xs text-tech-text/50">
<span><span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-1"></span>敌对/冲突</span>
<span><span class="inline-block w-3 h-3 rounded-full bg-blue-400 mr-1"></span>同盟/友好</span>
<span><span class="inline-block w-3 h-3 rounded-full bg-gray-500 mr-1"></span>从属/上下级</span>
<span><span class="inline-block w-3 h-3 rounded-full bg-cyan-400 mr-1"></span>其他关系</span>
</div></div>
</main>

<div id="exportOverlay" class="modal-overlay hidden" onclick="closeExportDialog(event)">
<div class="modal-panel" onclick="event.stopPropagation()">
<h3><i class="fa fa-download text-[#22d3ee] mr-2"></i>导出图谱</h3>
<div class="modal-option"><label>导出格式</label><div class="flex space-x-2">
<label class="cursor-pointer"><input type="radio" name="expFmt" value="png" checked onchange="updateExportPreview()"> PNG</label>
<label class="cursor-pointer"><input type="radio" name="expFmt" value="svg" onchange="updateExportPreview()"> SVG</label>
</div></div>
<div class="modal-option"><label>背景色</label><div class="flex space-x-2">
<label class="cursor-pointer"><input type="radio" name="expBg" value="dark" checked onchange="updateExportPreview()"> 深色</label>
<label class="cursor-pointer"><input type="radio" name="expBg" value="white" onchange="updateExportPreview()"> 白色</label>
</div></div>
<div id="resOption" class="modal-option"><label>分辨率 (PNG)</label><div class="flex space-x-2">
<label class="cursor-pointer"><input type="radio" name="expRes" value="1"> 1x</label>
<label class="cursor-pointer"><input type="radio" name="expRes" value="2" checked> 2x</label>
<label class="cursor-pointer"><input type="radio" name="expRes" value="4"> 4x</label>
</div></div>
<div class="modal-option"><label>包含图例</label><input type="checkbox" id="expLegend" checked></div>
<div class="mt-4 flex justify-end space-x-2">
<button onclick="closeExportDialog()" class="btn-tech text-sm">取消</button>
<button onclick="doExport()" class="btn-solid text-sm">导出</button>
</div>
<p id="exportInfo" class="text-xs text-tech-text/50 mt-2"></p>
</div></div>

<script>
let cy=null,allNodes=[],allEdges=[],currentNovel='',_initialZoomDone=false,_cfg={};
let _relNode='',_relAll=[],_relPage=0;const REL_PAGE=15;

function classifyRelation(t){const s=(t||'').toLowerCase();return/敌|仇|杀|战|斗|打|败|害|反|叛|怒|恨|争|怨/.test(s)?'hostile':/友|盟|同|帮|助|救|忠|护|师|徒|爱|情|亲/.test(s)?'friendly':/属|下|上|级|从|臣|君|主/.test(s)?'subordinate':'other';}
const eColor={hostile:'#ef4444',friendly:'#60a5fa',subordinate:'#6b7280',other:'#22d3ee'};
const nFill={'主角':'#f59e0b','配角':'#3b82f6'};
function calcDeg(e){const d={};e.forEach(r=>{d[r.source]=(d[r.source]||0)+1;d[r.target]=(d[r.target]||0)+1;});return d;}

AUTH.apiFetch('/api/novels').then(r=>r.json()).then(novels=>{
const sel=document.getElementById('novelSelector');
sel.innerHTML='<option value="">-- 选择书籍 --</option>';
novels.forEach(n=>{sel.innerHTML+=`<option value="${n.name}">${n.display_name||n.name}</option>`;});
if(novels.length>0){sel.value=novels[0].name;switchNovel();}
});

function switchNovel(){const n=document.getElementById('novelSelector').value;if(!n)return;
currentNovel=n;closeDetail();document.getElementById('graphInfo').textContent='加载中...';
AUTH.apiFetch(`/api/graph?novel=${encodeURIComponent(n)}`).then(r=>r.json()).then(d=>{
if(d.error||!d.nodes||d.nodes.length===0){document.getElementById('graphContainer').style.display='none';document.getElementById('graphEmpty').style.display='flex';document.getElementById('graphInfo').textContent=d.error||'暂无数据';return;}else{document.getElementById('graphContainer').style.display='block';document.getElementById('graphEmpty').style.display='none';}
allNodes=d.nodes||[];allEdges=d.edges||[];_cfg=d.layout||{};
document.getElementById('graphInfo').textContent=`${allNodes.length} 角色, ${allEdges.length} 关系`;
_cfg.minDegree=_cfg.minDegree||Math.max(2,Math.min(5,Math.floor(allNodes.length*0.005)));
_cfg.edgeLimit=_cfg.edgeLimit||Math.min(300+allNodes.length*0.3,600);
renderGraph(allNodes,allEdges,'full');});}

function renderGraph(nodes,edges,mode,centerNode){
_initialZoomDone=false;
if(cy){cy.removeAllListeners();cy.destroy();cy=null;}
const container=document.getElementById('graphContainer');
const degrees=calcDeg(edges);
const showAll=document.getElementById('isolatedToggle')?.value==='all';

let sn,se;
if(mode==='focus'&&centerNode){
const d=new Set([centerNode]);
edges.forEach(e=>{if(e.source===centerNode)d.add(e.target);if(e.target===centerNode)d.add(e.source);});
const id=new Set(d);
edges.forEach(e=>{if(d.has(e.source)&&!d.has(e.target))id.add(e.target);if(d.has(e.target)&&!d.has(e.source))id.add(e.source);});
sn=nodes.filter(n=>id.has(n.name));se=edges.filter(e=>new Set(sn.map(n=>n.name)).has(e.source)&&new Set(sn.map(n=>n.name)).has(e.target));
}else{
const minDeg=showAll?0:_cfg.minDegree||3;
sn=nodes.filter(n=>showAll||(degrees[n.name]||0)>=minDeg);
const sns=new Set(sn.map(n=>n.name));
se=edges.filter(e=>sns.has(e.source)&&sns.has(e.target));
}
se.sort((a,b)=>(b.weight||0)-(a.weight||0));
const el=mode==='focus'?Math.min(250,_cfg.edgeLimit*0.5):(_cfg.edgeLimit||500);
se=se.slice(0,Math.min(el,se.length));
const fs=new Set();se.forEach(e=>{fs.add(e.source);fs.add(e.target);});
sn=sn.filter(n=>fs.has(n.name)||(mode==='focus'&&n.name===centerNode));
const fn=new Set(sn.map(n=>n.name));se=se.filter(e=>fn.has(e.source)&&fn.has(e.target));
const fd=calcDeg(se);const mxd=Math.max(1,...Object.values(fd));
const els=[];
se.forEach(e=>{const r=classifyRelation(e.relation||'');const k=(e.weight||1)>=3||r==='hostile';const id=mode==='focus'&&centerNode&&e.source!==centerNode&&e.target!==centerNode;els.push({data:{id:'e_'+e.source+'_'+e.target,source:e.source,target:e.target,relType:r,isKey:k,weight:e.weight||1,isIndirect:id||false}});});
sn.forEach(n=>{
const dg=fd[n.name]||0;const sn=Math.log2(Math.max(dg,1)+1)/Math.log2(mxd+1);
const ms=_cfg.maxNodeSize||12;const mn=_cfg.minNodeSize||3;
const sz=mode==='focus'?(n.name===centerNode?Math.min(ms*1.2,40):Math.max(mn,mn+sn*(ms*0.8))):Math.max(mn,mn+sn*ms);
let fl=0;if(mode==='focus'&&centerNode){if(n.name===centerNode)fl=0;else if(se.some(e=>(e.source===centerNode&&e.target===n.name)||(e.target===centerNode&&e.source===n.name)))fl=1;else fl=2;}
els.push({data:{id:n.name,label:n.name,role:n.role||'未知',mention:n.mention_count||0,deg:dg||0,size:Math.round(sz),fl:fl}});});

const style=[
{selector:'node',style:{'label':'data(label)','font-size':function(el){return Math.max(4,Math.min(11,el.data('size')*0.22))+'px';},'color':'#f3f4f6','text-valign':'bottom','text-halign':'center','text-margin-y':1,'width':'data(size)','height':'data(size)','border-width':function(el){return el.data('fl')===0?3:(el.data('deg')>10?2:1);},'border-color':function(el){return el.data('fl')===0?'#fbbf24':'#e5e7eb';},'background-color':function(el){return nFill[el.data('role')]||'#6b7280';},'min-zoomed-font-size':1,'z-index':function(el){return -el.data('size');}}},
{selector:'edge',style:{'width':function(el){return Math.max(0.1,Math.min(1,(el.data('weight')||1)*0.12));},'line-color':function(el){return eColor[el.data('relType')]||'#6b7280';},'opacity':function(el){if(mode==='focus'&&el.data('isIndirect'))return 0.01;return el.data('isKey')?0.3:0.03;},'curve-style':'haystack','haystack-radius':0.3,'line-style':function(el){return el.data('relType')==='hostile'?'dashed':'solid';}}},
{selector:':selected',style:{'border-color':'#fbbf24','border-width':3}}];

const instance=cytoscape({container,elements:els,style,minZoom:0.02,maxZoom:8});
cy=instance;
cy.on('tap','node',function(evt){showNodeDetail(evt.target.id());});
cy.on('tap',function(evt){if(evt.target===cy)closeDetail();});
cy.on('cxttap','node',function(evt){if(!_editMode)return;evt.originalEvent.preventDefault();showNodeEditMenu(evt.target.id());});
cy.on('cxttap','edge',function(evt){if(!_editMode)return;evt.originalEvent.preventDefault();const e=evt.target;showEdgeEditMenu(e.data('source'),e.data('target'));});
cy.on('mouseover','node',function(evt){const n=evt.target;const t=document.getElementById('nodeTooltip')||(()=>{const e=document.createElement('div');e.id='nodeTooltip';e.className='node-tooltip';document.body.appendChild(e);return e;})();t.textContent=`${n.data('label')} | ${n.data('role')} | 关联${n.data('deg')}人 | 出场${n.data('mention')}次`;t.style.display='block';t.style.left=(evt.originalEvent.clientX+12)+'px';t.style.top=(evt.originalEvent.clientY-10)+'px';});
cy.on('mouseout','node',()=>{const t=document.getElementById('nodeTooltip');if(t)t.style.display='none';});

const rep=_cfg.nodeRepulsion||800000;const grv=_cfg.gravity||0.01;const ide=_cfg.idealEdgeLength||Math.min(300,80+Math.sqrt(Math.max(allNodes.length,10))*8);const niter=_cfg.numIter||Math.min(2000+allNodes.length*3,4000);
const pad=mode==='focus'?70:50;

instance.on('layoutstop',function(){
const ST=Math.max(15,_cfg.sepThreshold||20);
for(let i=0;i<40;i++){let mm=0;const na=instance.nodes();for(let x=0;x<na.length;x++){const a=na[x];const pa=a.position();const sa=a.data('size')||6;for(let y=x+1;y<na.length;y++){const b=na[y];const pb=b.position();const sb=b.data('size')||6;const dx=pb.x-pa.x,dy=pb.y-pa.y;const d=Math.sqrt(dx*dx+dy*dy);const min=(sa+sb)/2+ST;if(d<min&&d>0.01){const p=(min-d)/2*0.6;b.position({x:pb.x+dx/d*p,y:pb.y+dy/d*p});a.position({x:pa.x-dx/d*p,y:pa.y-dy/d*p});mm=Math.max(mm,p);}}}if(mm<0.3)break;}
instance.fit(undefined,pad);instance.center();
if(mode==='focus'&&centerNode){const el=instance.getElementById(centerNode);if(el.length>0)setTimeout(()=>instance.fit(el,pad+20),100);}
else if(!_initialZoomDone){_initialZoomDone=true;const zj=sn.find(n=>n.name.includes('赵玖'));if(zj)setTimeout(()=>instance.fit(instance.getElementById(zj.name),pad+30),200);}
const fc=nodes.length-sn.length;
document.getElementById('graphInfo').textContent=`${sn.length} 角色, ${se.length} 关系${fc>0?` (过滤 ${fc} 个节点)`:''} · ${mode==='focus'?'聚焦: '+(centerNode||''):'全图'}`;
});

instance.layout({name:'cose',animate:false,
nodeRepulsion:showAll?Math.min(rep*1.3,3000000):Math.min(rep,2000000),
idealEdgeLength:showAll?Math.min(ide*1.2,400):ide,
edgeElasticity:0.3,
gravity:showAll?Math.max(0.003,grv*0.5):Math.max(0.003,grv*0.8),
numIter:niter,initialTemp:3000,coolingFactor:0.98,minTemp:0.5}).run();

let _lt=null;const fh=_cfg.labelHideFull||0.07;const ch=_cfg.labelHideCore||0.15;
cy.on('zoom',()=>{if(_lt)clearTimeout(_lt);const z=cy.zoom();cy.nodes().forEach(n=>{const fl=n.data('fl')||0;const dg=n.data('deg')||0;let op=1;if(z<fh)op=0;else if(z<ch)op=(fl===0||dg>=8)?1:0;else if(z<ch*1.5)op=(dg>=3||fl===0)?1:0.3;n.style({'text-opacity':op});});_lt=setTimeout(()=>{if(cy.zoom()>ch*1.7)cy.nodes().forEach(n=>n.style({'text-opacity':1}));},300);});
window.addEventListener('resize',function(){clearTimeout(window._rt);window._rt=setTimeout(()=>{if(cy&&cy.nodes().length>0){cy.fit(undefined,pad);cy.center();}},300);});
}

function showNodeDetail(id){const n=allNodes.find(x=>x.name===id);if(!n)return;
const p=document.getElementById('nodeDetail');_relNode=id;_relAll=allEdges.filter(e=>e.source===id||e.target===id);_relPage=0;
document.getElementById('detailName').textContent=n.name;document.getElementById('detailRole').textContent='角色: '+(n.role||'未知');
document.getElementById('detailCount').textContent='关联: '+_relAll.length+' 人 | 出场: '+(n.mention_count||0)+' 次';
document.getElementById('relCount').textContent='('+_relAll.length+'条)';renderRelPage();p.style.display='flex';p.classList.remove('hidden');}
function renderRelPage(){const s=_relPage*REL_PAGE,e=Math.min(s+REL_PAGE,_relAll.length),items=_relAll.slice(s,e),tp=Math.ceil(_relAll.length/REL_PAGE);
document.getElementById('detailRelations').innerHTML=items.map(r=>{const o=r.source===_relNode?r.target:r.source,rel=classifyRelation(r.relation||''),c=eColor[rel],t=r.relation||'',d=t.length>30?t.slice(0,28)+'…':t;return `<div class="text-gray-300 py-1.5 border-b border-tech-border/50 last:border-0" style="word-break:break-word;overflow-wrap:break-word;"><span class="inline-flex items-center gap-1.5"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0;"></span><span class="font-medium text-gray-200">${o}</span></span><div class="text-gray-500 mt-0.5 pl-4 text-xs" title="${t.replace(/"/g,'&quot;')}">${d}</div></div>`;}).join('');
const p=document.getElementById('relPagination');if(tp<=1)p.classList.add('hidden');else{p.classList.remove('hidden');document.getElementById('relPageInfo').textContent=(_relPage+1)+'/'+tp;document.getElementById('relPrev').disabled=_relPage<=0;document.getElementById('relNext').disabled=_relPage>=tp-1;}}
function nextRelPage(){const tp=Math.ceil(_relAll.length/REL_PAGE);if(_relPage<tp-1){_relPage++;renderRelPage();}}
function prevRelPage(){if(_relPage>0){_relPage--;renderRelPage();}}
function closeDetail(){const p=document.getElementById('nodeDetail');p.style.display='none';p.classList.add('hidden');_relNode='';_relAll=[];_relPage=0;}

function filterNode(){const q=document.getElementById('searchNode').value.trim().toLowerCase();if(!q){resetView();return;}const m=allNodes.filter(n=>n.name.toLowerCase().includes(q));if(m.length===0){alert('未找到匹配的人物');return;}closeDetail();renderGraph(allNodes,allEdges,'focus',m[0].name);}
function resetView(){closeDetail();_initialZoomDone=false;renderGraph(allNodes,allEdges,'full');}
function filterByRole(){const r=document.getElementById('roleFilter').value;closeDetail();if(r==='all'){renderGraph(allNodes,allEdges,'full');return;}const f=allNodes.filter(n=>n.role===r),ns=new Set(f.map(n=>n.name)),e=allEdges.filter(x=>ns.has(x.source)&&ns.has(x.target));renderGraph(f,e,'full');}


let _editMode = false;

AUTH.apiFetch("/api/graph/edit/check")
  .then(r=>r.json()).then(d=>{ if(d.editable) document.getElementById("editToggle").classList.remove("hidden"); }).catch(()=>{});

function toggleEditMode() {
  _editMode = !_editMode;
  const btn = document.getElementById("editToggle");
  btn.classList.toggle("btn-solid", _editMode);
  btn.classList.toggle("btn-tech", !_editMode);
  btn.innerHTML = _editMode ? '<i class="fa fa-check mr-1"></i>完成编辑' : '<i class="fa fa-pencil mr-1"></i>编辑';
  if(cy){ cy.nodes().style("border-color", _editMode ? "#fbbf24" : "#e5e7eb"); }
  // 编辑模式下阻止图谱区域右键菜单
  const container = document.getElementById('graphContainer');
  if (_editMode) {
    container.addEventListener('contextmenu', _preventCtx, true);
  } else {
    container.removeEventListener('contextmenu', _preventCtx, true);
  }
}
function _preventCtx(e) { e.preventDefault(); }



function showNodeEditMenu(nodeId) {
  const overlay = document.createElement("div");
  overlay.className = "fixed inset-0 z-50 flex items-center justify-center";
  overlay.style.background = "rgba(0,0,0,0.6)";
  overlay.innerHTML = '<div class="bg-[#1a1f2e] border border-tech-border rounded-xl p-5 w-96 shadow-2xl" onclick="event.stopPropagation()">'
    + '<h3 class="font-bold mb-3"><i class="fa fa-pencil text-[#22d3ee] mr-2"></i>编辑节点：' + nodeId + '</h3>'
    + '<div class="space-y-2">'
    + '<button onclick="this.closest(\'.fixed\').remove();showMergeDialog()" class="w-full text-left px-3 py-2 rounded-lg bg-tech-card hover:bg-tech-main/10">'
    + '<i class="fa fa-compress text-yellow-400 mr-2"></i>合并到其他节点</button>'
    + '<button onclick="this.closest(\'.fixed\').remove()" class="w-full text-left px-3 py-2 rounded-lg bg-tech-card hover:bg-tech-main/10">'
    + '<i class="fa fa-times text-tech-text/40 mr-2"></i>取消</button>'
    + '</div></div>';
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  window._editNodeId = nodeId;
}

function showEdgeEditMenu(src, tgt) {
  const overlay = document.createElement("div");
  overlay.className = "fixed inset-0 z-50 flex items-center justify-center";
  overlay.style.background = "rgba(0,0,0,0.6)";
  overlay.innerHTML = '<div class="bg-[#1a1f2e] border border-tech-border rounded-xl p-5 w-96 shadow-2xl" onclick="event.stopPropagation()">'
    + '<h3 class="font-bold mb-3"><i class="fa fa-pencil text-[#22d3ee] mr-2"></i>编辑关系</h3>'
    + '<p class="text-sm text-tech-text/60 mb-3">' + src + ' → ' + tgt + '</p>'
    + '<input id="editRelInput" class="w-full px-3 py-2 rounded-lg bg-tech-card border border-tech-border text-white text-sm" placeholder="输入新关系描述">'
    + '<div class="flex gap-2 mt-4">'
    + '<button onclick="updateRelation(\'' + src + '\',\'' + tgt + '\')" class="btn-solid text-sm flex-1 justify-center"><i class="fa fa-save mr-1"></i>修改</button>'
    + '<button onclick="deleteEdge(\'' + src + '\',\'' + tgt + '\')" class="btn-tech text-sm" style="color:#ef4444;border-color:#ef4444"><i class="fa fa-trash mr-1"></i>删除</button>'
    + '<button onclick="this.closest(\'.fixed\').remove()" class="btn-tech text-sm">取消</button>'
    + '</div></div>';
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

function deleteEdge(src, tgt) {
  if (!confirm("确定删除 " + src + " → " + tgt + " 的关系？")) return;
  const novel = document.getElementById("novelSelector").value;
  AUTH.apiFetch("/api/graph/edit/delete-edge", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({novel:novel,source:src,target:tgt})
  }).then(r=>r.json()).then(d=>{ if(d.status==="ok"){ alert("已删除"); location.reload(); } else alert("失败: "+d.detail); });
}

function updateRelation(src, tgt) {
  const rel = document.getElementById("editRelInput").value;
  if (!rel) return alert("请输入关系描述");
  const novel = document.getElementById("novelSelector").value;
  AUTH.apiFetch("/api/graph/edit/update-relation", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({novel:novel,source:src,target:tgt,relation:rel})
  }).then(r=>r.json()).then(d=>{ if(d.status==="ok"){ alert("已更新"); location.reload(); } else alert("失败: "+d.detail); });
}

function showMergeDialog() {
  const nodeId = window._editNodeId;
  const overlay = document.createElement("div");
  overlay.className = "fixed inset-0 z-50 flex items-center justify-center";
  overlay.style.background = "rgba(0,0,0,0.6)";
  overlay.innerHTML = '<div class="bg-[#1a1f2e] border border-tech-border rounded-xl p-5 w-96 shadow-2xl" onclick="event.stopPropagation()">'
    + '<h3 class="font-bold mb-3"><i class="fa fa-compress text-yellow-400 mr-2"></i>合并节点</h3>'
    + '<p class="text-sm text-tech-text/60 mb-3">将 <b>' + (nodeId||'') + '</b> 合并到：</p>'
    + '<input id="mergeTargetInput" class="w-full px-3 py-2 rounded-lg bg-tech-card border border-tech-border text-white text-sm" placeholder="输入目标人物名">'
    + '<div class="flex gap-2 mt-4">'
    + '<button onclick="doMerge()" class="btn-solid text-sm flex-1 justify-center"><i class="fa fa-compress mr-1"></i>合并</button>'
    + '<button onclick="this.closest(\'.fixed\').remove()" class="btn-tech text-sm">取消</button>'
    + '</div></div>';
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}


function closeEditModal() {
  document.querySelectorAll("body > div.fixed").forEach(el => el.remove());
}
function doMerge() {
  const src = window._editNodeId;
  const tgt = document.getElementById("mergeTargetInput").value;
  if (!src || !tgt) return alert("请输入目标人物名");
  if (!confirm("确定将「" + src + "」合并到「" + tgt + "」？此操作不可撤销。")) return;
  const novel = document.getElementById("novelSelector").value;
  AUTH.apiFetch("/api/graph/edit/merge-nodes", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({novel:novel,source:src,target:tgt})
  }).then(r=>r.json()).then(d=>{ if(d.status==="ok"){ alert("已合并"); location.reload(); } else alert("失败: "+d.detail); });
}

function getNovelName(){const s=document.getElementById('novelSelector');return s.options[s.selectedIndex]?.text||'graph';}
function getLegendSVG(bg){const isDark=bg!=='#ffffff',tx=isDark?'#f3f4f6':'#1f2937',box=isDark?'rgba(17,24,39,0.85)':'rgba(255,255,255,0.85)',bd=isDark?'#4b5563':'#d1d5db';const items=[{c:'#ef4444',l:'敌对/冲突'},{c:'#60a5fa',l:'同盟/友好'},{c:'#6b7280',l:'从属/上下级'},{c:'#22d3ee',l:'其他关系'}];let l=`<rect x="0" y="0" width="210" height="110" rx="6" fill="${box}" stroke="${bd}" stroke-width="1"/><text x="12" y="20" fill="${tx}" font-size="13" font-family="sans-serif">关系类型</text>`;items.forEach((o,i)=>{const yy=36+i*18;l+=`<circle cx="16" cy="${yy}" r="5" fill="${o.c}"/><text x="28" y="${yy+4}" fill="${tx}" font-size="11" font-family="sans-serif">${o.l}</text>`;});return '<svg xmlns="http://www.w3.org/2000/svg" width="210" height="110">'+l+'</svg>';}
function openExportDialog(){if(!cy){alert('图谱尚未加载');return;}updateExportPreview();document.getElementById('exportOverlay').classList.remove('hidden');}
function closeExportDialog(e){if(e&&e.target!==e.currentTarget&&!e.target.closest('.modal-panel'))return;document.getElementById('exportOverlay').classList.add('hidden');}
function updateExportPreview(){const fmt=document.querySelector('input[name="expFmt"]:checked').value;document.getElementById('resOption').style.display=fmt==='png'?'flex':'none';document.getElementById('exportInfo').textContent=fmt==='png'?'PNG 原生输出，无需截图':'SVG 内嵌高清图，可无限缩放';}
function doExport(){if(!cy){alert('图谱未加载');return;}const fmt=document.querySelector('input[name="expFmt"]:checked').value,bg=document.querySelector('input[name="expBg"]:checked').value,leg=document.getElementById('expLegend').checked;closeExportDialog();const bgC=bg==='white'?'#ffffff':'#111827',nC=bg==='white'?'#1f2937':'#f3f4f6';cy.style().selector('node').style('color',nC).update();if(fmt==='png'){const res=parseInt(document.querySelector('input[name="expRes"]:checked')?.value||'2'),d=cy.png({scale:res,bg:bgC,full:true});if(leg){const c=document.createElement('canvas'),i=new Image();i.onload=()=>{const w=cy.width()*res,h=cy.height()*res;c.width=w;c.height=h+130*res;const ctx=c.getContext('2d');ctx.drawImage(i,0,0);const li=new Image();li.onload=()=>{ctx.drawImage(li,w-230*res,h+10*res,210*res,110*res);downloadBlob(c.toDataURL('image/png'),getNovelName()+'_graph.png');};li.src='data:image/svg+xml,'+encodeURIComponent(getLegendSVG(bgC));};i.src=d;return;}downloadBlob(d,getNovelName()+'_graph.png');return;}const s=2,d=cy.png({scale:s,bg:bgC,full:true}),w=cy.width(),h=cy.height();let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h+(leg?130:0)}" viewBox="0 0 ${w} ${h+(leg?130:0)}"><image href="${d}" width="${w}" height="${h}"/>`;if(leg){svg+=`<foreignObject x="${w-220}" y="${h+10}" width="210" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="background:${bgC};border:1px solid #d1d5db;border-radius:6px;padding:8px;font-family:sans-serif;font-size:12px;color:${nC}"><b style="font-size:13px">关系类型</b>`;[['#ef4444','敌对/冲突'],['#60a5fa','同盟/友好'],['#6b7280','从属/上下级'],['#22d3ee','其他关系']].forEach(o=>{svg+=`<div style="margin-top:4px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${o[0]};margin-right:6px"></span>${o[1]}</div>`;});svg+=`</div></foreignObject>`;}svg+=`</svg>`;const b=new Blob([svg],{type:'image/svg+xml'}),u=URL.createObjectURL(b);var a=document.createElement('a');a.download=getNovelName()+'_graph.svg';a.href=u;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);cy.style().selector('node').style('color','#f3f4f6').update();}
function downloadBlob(d,f){var a=document.createElement('a');a.download=f;a.href=d;document.body.appendChild(a);a.click();document.body.removeChild(a);}
</script>
</body>
</html>
